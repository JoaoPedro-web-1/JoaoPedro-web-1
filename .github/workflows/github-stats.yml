name: GitHub Stats

on:
  push:
    branches:
      - main  # ou a branch principal do seu repositório

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate GitHub stats
        uses: anuraghazra/github-readme-stats@v2
        with:
          status: true
          top-langs: true
          hide_border: true
          custom_title: 'My Stats'

      - name: Save stats
        run: |
          mkdir -p profile
          cp ./stats.svg ./profile/stats.svg
          cp ./top-langs.svg ./profile/top-langs.svg

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add profile/stats.svg profile/top-langs.svg
          git commit -m 'Update stats SVGs'
          git push